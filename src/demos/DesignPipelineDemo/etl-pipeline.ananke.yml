# etl-pipeline.ananke.yml
# ────────────────────────────────────────────────
# Declarative workflow: topology + agent config.
# Job implementations are bound in code via Bind().
# Agent jobs are auto-built from this config.
# ────────────────────────────────────────────────

name: etl-pipeline

# Model aliases — resolved to IAgentModel instances at load time.
# API keys come from secrets.json, not this file.
# For local models (Ollama, LM Studio, vLLM), add an endpoint field:
#   local:
#     provider: openai
#     model: llama3.2
#     endpoint: http://localhost:11434/v1
models:
  planner:
    provider: openai
    model: gpt-4.1-mini
  analyst:
    provider: openai
    model: gpt-4.1-mini

# Job declarations — "type: agent" jobs are auto-constructed from config.
# "type: code" jobs must be bound in code via Bind().
jobs:
  plan:
    type: agent
    model: planner
    system_prompt: |
      You are an ETL planning agent. Given a data request, produce a short
      structured plan with two fields: "fetch_a_query" and "fetch_b_query".
      Each field should be a concise search query for the respective dataset.
      Respond as JSON only.
    max_tool_rounds: 1

  fetch_a:
    type: code

  fetch_b:
    type: code

  transform_a:
    type: agent
    model: analyst
    system_prompt: |
      You are a data transformation agent for dataset A.
      You receive raw data and produce a cleaned, normalized summary.
      Respond with a concise plain-text summary (2-3 sentences).

  transform_b:
    type: agent
    model: analyst
    system_prompt: |
      You are a data transformation agent for dataset B.
      You receive raw data and produce a cleaned, normalized summary.
      Respond with a concise plain-text summary (2-3 sentences).

  combine:
    type: agent
    model: planner
    system_prompt: |
      You are a synthesis agent. You receive two transformed dataset summaries
      and produce a final combined report. Respond with a concise plain-text
      summary (3-5 sentences) that merges both datasets.

# Topology — DSL syntax.
connections:
  - plan -> fork(fetch_a, fetch_b)
  - fetch_a -> transform_a
  - fetch_b -> transform_b
  - join(transform_a, transform_b) -> combine
  - combine -> End

