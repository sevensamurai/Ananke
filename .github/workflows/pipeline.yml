name: Build and Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pull requests get no job here: card verify (scripts/ci.sh) gates a merge. This job runs the
  # same script before publish, so the two never list different checks.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Single source of truth with local dev. Ananke.Analyzers needs Roslyn 5.6, so
          # anything below SDK 10.0.302 fails every project with CS9057.
          global-json-file: global.json

      - name: Check, build and test
        run: bash scripts/ci.sh

  publish:
    needs: build
    # Packages, tags and releases come from the public repo only. Forks build and test,
    # but must never push to NuGet or cut a release under their own name.
    if: >-
      github.repository == 'sevensamurai/Ananke'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC token for NuGet trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet restore src/Ananke.slnx
          dotnet build src/Ananke.slnx --configuration Release
          dotnet pack src/Ananke.slnx --configuration Release --no-build --output ./packages

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Ananke packages to NuGet
        run: |
          for pkg in ./packages/Ananke*.nupkg; do
            [ -f "$pkg" ] && dotnet nuget push "$pkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish nnke tools to NuGet
        # Covers: nnke
        run: |
          for pkg in ./packages/nnke*.nupkg; do
            [ -f "$pkg" ] && dotnet nuget push "$pkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="releases/v${VERSION}.md"
          # The build job fails when $NOTES is missing, so it is always there.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release."
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --latest \
              ./packages/*.nupkg ./packages/*.snupkg
          fi
