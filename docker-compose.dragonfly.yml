# Dragonfly — Recommended for development and demos
# Redis-compatible, multi-threaded, with persistence enabled.
# https://www.dragonflydb.io/
#
# Usage:
#   docker compose -f docker-compose.dragonfly.yml up -d
#
# Connect from Ananke:
#   services.AddRedis(c => { c.Host = "localhost"; c.Port = 6379; });

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    command: >
      dragonfly
      --dbfilename dump
      --dir /data
    restart: unless-stopped

volumes:
  dragonfly-data:
