<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananke — AI Agent Orchestration for .NET</title>
    <meta name="description" content="Documentation for Ananke, a vendor-agnostic .NET framework for AI agent orchestration.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" id="hljs-dark">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/csharp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/xml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!--
        ============================================================
        THEME / COLOR PALETTE
        To change the site palette, edit ONLY the custom properties
        below. Everything else derives from these five brand colors.
        Palette source: https://coolors.co/palette/8ecae6-219ebc-023047-ffb703-fb8500
        ============================================================
    -->
    <style>
        :root {
            /* ── Brand palette (edit these to reskin) ────────────── */
            --brand-sky:    #8ECAE6;   /* light blue  — highlights    */
            --brand-teal:   #219EBC;   /* teal        — primary / links */
            --brand-navy:   #023047;   /* dark navy   — headings / sidebar */
            --brand-amber:  #FFB703;   /* amber       — accents / badges */
            --brand-orange: #FB8500;   /* orange      — CTA / strong   */

            /* ── Derived tokens (light mode) ─────────────────────── */
            --sidebar-bg:           #f4f8fb;
            --sidebar-text:         var(--brand-navy);
            --sidebar-active-bg:    color-mix(in srgb, var(--brand-teal) 12%, transparent);
            --sidebar-active-text:  var(--brand-teal);
            --sidebar-hover-bg:     color-mix(in srgb, var(--brand-sky) 25%, transparent);
            --sidebar-section:      var(--brand-navy);
            --sidebar-border:       color-mix(in srgb, var(--brand-sky) 40%, transparent);

            --topbar-bg:            var(--brand-navy);
            --topbar-text:          #ffffff;
            --topbar-accent:        var(--brand-amber);

            --link-color:           var(--brand-teal);
            --link-hover:           var(--brand-navy);

            --badge-bg:             color-mix(in srgb, var(--brand-amber) 18%, transparent);
            --badge-text:           #94660a;
            --badge-border:         var(--brand-amber);

            --toc-text:             #5a6872;
            --toc-active:           var(--brand-teal);
            --toc-border:           color-mix(in srgb, var(--brand-sky) 50%, transparent);

            --code-bg:              #f6f8fa;
            --content-max:          54rem;

            --copy-btn-bg:          color-mix(in srgb, var(--brand-sky) 30%, transparent);
            --copy-btn-hover:       color-mix(in srgb, var(--brand-teal) 20%, transparent);

            --footer-bg:            var(--topbar-bg);
            --footer-text:          #aebdc7;
            --footer-border:        color-mix(in srgb, var(--brand-sky) 24%, transparent);
            --footer-link:          var(--brand-sky);
        }

        [data-theme="dark"] {
            --sidebar-bg:           #001a2c;
            --sidebar-text:         #c4d6e0;
            --sidebar-active-bg:    color-mix(in srgb, var(--brand-teal) 18%, transparent);
            --sidebar-active-text:  var(--brand-sky);
            --sidebar-hover-bg:     color-mix(in srgb, var(--brand-teal) 10%, transparent);
            --sidebar-section:      var(--brand-sky);
            --sidebar-border:       #0a3554;

            --topbar-bg:            #001520;
            --topbar-text:          #e2edf4;
            --topbar-accent:        var(--brand-amber);

            --link-color:           var(--brand-sky);
            --link-hover:           #ffffff;

            --badge-bg:             color-mix(in srgb, var(--brand-amber) 14%, transparent);
            --badge-text:           var(--brand-amber);
            --badge-border:         color-mix(in srgb, var(--brand-amber) 40%, transparent);

            --toc-text:             #8899a4;
            --toc-active:           var(--brand-sky);
            --toc-border:           #0a3554;

            --code-bg:              #0d1f2d;
            --content-max:          54rem;

            --copy-btn-bg:          color-mix(in srgb, var(--brand-navy) 60%, transparent);
            --copy-btn-hover:       color-mix(in srgb, var(--brand-teal) 30%, transparent);

            --footer-bg:            var(--topbar-bg);
            --footer-text:          #8899a4;
            --footer-border:        #0a3554;
            --footer-link:          var(--brand-sky);
        }

        /* ── Reset / base ──────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        a { color: var(--link-color); }
        a:hover { color: var(--link-hover); }

        /* ── Top bar ───────────────────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0 1.25rem;
            height: 3.25rem;
            background: var(--topbar-bg);
            color: var(--topbar-text);
            flex-shrink: 0;
            z-index: 100;
        }

        .topbar-logo {
            height: 1.75rem;
            border-radius: 4px;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--topbar-text);
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .topbar-brand:hover { color: var(--topbar-text); }

        .topbar-title {
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        /* ── Hamburger button ───────────────────────────────────── */
        .hamburger {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--topbar-text);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            line-height: 1;
            transition: border-color 0.12s;
        }

        .hamburger:hover { border-color: var(--topbar-accent); }

        /* ── Menu overlay ───────────────────────────────────────── */
        .menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            top: 3.25rem;
            background: rgba(0,0,0,0.3);
            z-index: 89;
        }

        .menu-backdrop.open { display: block; }

        .menu-panel {
            display: none;
            position: fixed;
            top: 3.25rem;
            right: 0;
            width: min(18rem, 85vw);
            bottom: 0;
            background: var(--sidebar-bg);
            border-left: 1px solid var(--sidebar-border);
            box-shadow: -4px 0 16px rgba(0,0,0,0.12);
            overflow-y: auto;
            padding: 0.5rem 0;
            z-index: 90;
        }

        .menu-panel.open { display: block; }

        .menu-section {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--sidebar-section);
            padding: 0.75rem 1rem 0.25rem;
        }

        .menu-panel a {
            display: block;
            padding: 0.4rem 1rem 0.4rem 1.5rem;
            font-size: 0.84rem;
            color: var(--sidebar-text);
            text-decoration: none;
            line-height: 1.45;
            transition: background 0.1s;
        }

        .menu-panel a:hover {
            background: var(--sidebar-hover-bg);
            color: var(--sidebar-text);
        }

        .menu-panel a.active {
            background: var(--sidebar-active-bg);
            color: var(--sidebar-active-text);
            font-weight: 600;
        }

        .topbar-spacer { flex: 1; }

        .topbar-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar-links a {
            color: var(--topbar-text);
            opacity: 0.85;
            text-decoration: none;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .topbar-links a:hover {
            opacity: 1;
            color: var(--topbar-accent);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--topbar-text);
            cursor: pointer;
            font-size: 1.15rem;
            padding: 0.25rem;
            opacity: 0.85;
            line-height: 1;
        }

        .theme-toggle:hover { opacity: 1; }
        /* top-nav-dropdown-styles */
        .topnav {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .topnav-item {
            position: relative;
        }

        .topnav-item > button {
            background: none;
            border: none;
            color: var(--topbar-text);
            cursor: pointer;
            font-size: 0.82rem;
            padding: 0.5rem 0.65rem;
            text-decoration: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            opacity: 0.9;
            transition: opacity 0.12s;
            line-height: 1;
        }

        .topnav-item > a {
            color: var(--topbar-text);
            font-size: 0.82rem;
            padding: 0.5rem 0.65rem;
            text-decoration: none;
            white-space: nowrap;
            opacity: 0.9;
            transition: opacity 0.12s;
        }

        .topnav-item > a:hover,
        .topnav-item > button:hover { opacity: 1; color: var(--topbar-accent); }

        .topnav-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 15rem;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 0.4rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 0.35rem 0;
            z-index: 110;
        }

        .topnav-item.open > .topnav-dropdown { display: block; }

        .topnav-dropdown a {
            display: block;
            padding: 0.38rem 1rem;
            font-size: 0.84rem;
            color: var(--sidebar-text);
            text-decoration: none;
            line-height: 1.45;
            transition: background 0.1s;
        }

        .topnav-dropdown a:hover {
            background: var(--sidebar-hover-bg);
            color: var(--sidebar-active-text);
        }

        .topnav-dropdown .dropdown-heading {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-section);
            padding: 0.55rem 1rem 0.2rem;
            pointer-events: none;
        }

        .topnav-dropdown .dropdown-heading:first-child { padding-top: 0.25rem; }

        .topnav-dropdown-wide {
            min-width: 38rem;
            padding: 0.5rem;
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.15rem 1.5rem;
        }

        .topnav-item.open > .topnav-dropdown-wide { display: grid; }

        .topnav-dropdown-wide .dropdown-col { padding: 0.15rem 0; }

        .topnav-dropdown-wide .dropdown-heading {
            padding: 0.3rem 0.75rem 0.15rem;
        }

        .topnav-dropdown-wide a {
            padding: 0.3rem 0.75rem;
            font-size: 0.82rem;
        }

        /* collapsible-hamburger-sections */
        .menu-section {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .menu-section::after {
            content: '\25B8';
            font-size: 0.65rem;
            transition: transform 0.15s;
            margin-right: 0.25rem;
        }

        .menu-section.expanded::after {
            transform: rotate(90deg);
        }

        .menu-group {
            display: none;
        }

        .menu-group.expanded {
            display: block;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* ── Footer ──────────────────────────────────────────── */
        .site-footer {
            flex-shrink: 0;
            background: var(--footer-bg);
            color: var(--footer-text);
            border-top: 1px solid var(--footer-border);
            padding: 0.6rem 1rem;
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .site-footer-inner {
            max-width: calc(var(--content-max) + 14rem);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .site-footer a {
            color: var(--footer-link);
            text-decoration: none;
        }

        .site-footer a:hover { text-decoration: underline; }

        .footer-love {
            width: 0.9rem;
            height: 0.9rem;
            vertical-align: -0.12em;
            margin: 0 0.2rem;
            color: #EF4035;
            fill: #EF4035;
            stroke: #EF4035;
            stroke-width: 1.8;
        }

        .content-wrap {
            display: flex;
            gap: 2rem;
            max-width: calc(var(--content-max) + 14rem);
            width: 100%;
            margin: 0 auto;
            padding: 2rem 2.5rem 4rem;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        /* Markdown content styling */
        .content h1 { font-size: 1.8rem; margin-top: 0; color: var(--brand-navy); border-bottom: 2px solid var(--sidebar-border); padding-bottom: 0.4rem; }
        .content h2 { font-size: 1.35rem; margin-top: 2rem; color: var(--brand-navy); }
        .content h2 a, .content h3 a { color: var(--link-color); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link-color) 40%, transparent); text-underline-offset: 2px; }
        .content h3 { font-size: 1.1rem; margin-top: 1.5rem; color: var(--brand-navy); }

        [data-theme="dark"] .content h1,
        [data-theme="dark"] .content h2,
        [data-theme="dark"] .content h3 { color: var(--brand-sky); }

        .content pre {
            position: relative;
            background: var(--code-bg);
            border-radius: 0.4rem;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.55;
        }

        .content pre code {
            background: none;
            padding: 0;
        }

        .content code {
            background: var(--code-bg);
            padding: 0.15em 0.35em;
            border-radius: 0.25rem;
            font-size: 0.88em;
        }

        .content table {
            width: 100%;
            font-size: 0.88rem;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .content table th {
            background: color-mix(in srgb, var(--brand-sky) 15%, transparent);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .content table th,
        .content table td {
            padding: 0.45rem 0.75rem;
            border: 1px solid var(--sidebar-border);
            text-align: left;
        }

        .content img {
            max-width: 100%;
            border-radius: 0.4rem;
        }

        .content blockquote {
            border-left: 4px solid var(--brand-amber);
            background: var(--badge-bg);
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0 0.3rem 0.3rem 0;
        }

        .content hr {
            border: none;
            border-top: 1px solid var(--sidebar-border);
            margin: 2rem 0;
        }

        /* Copy button on code blocks */
        .copy-btn {
            position: absolute;
            top: 0.4rem;
            right: 0.4rem;
            background: var(--copy-btn-bg);
            border: none;
            border-radius: 0.25rem;
            color: var(--sidebar-text);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .content pre:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: var(--copy-btn-hover); }

        /* ── Table of Contents (right rail) ────────────────────── */
        .toc {
            width: 12rem;
            flex-shrink: 0;
            position: sticky;
            top: 1rem;
            align-self: flex-start;
            max-height: calc(100vh - 6rem);
            overflow-y: auto;
        }

        .toc-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--sidebar-section);
            margin-bottom: 0.5rem;
        }

        .toc a {
            display: block;
            padding: 0.2rem 0 0.2rem 0.75rem;
            font-size: 0.78rem;
            color: var(--toc-text);
            text-decoration: none;
            border-left: 2px solid var(--toc-border);
            line-height: 1.4;
            cursor: pointer;
        }

        .toc a:hover,
        .toc a.active {
            color: var(--toc-active);
            border-left-color: var(--toc-active);
        }

        .toc a.toc-h3 {
            padding-left: 1.4rem;
            font-size: 0.74rem;
        }

        /* ── Search ─────────────────────────────────────────────── */
        .search-btn {
            background: none;
            border: 1px solid color-mix(in srgb, var(--topbar-text) 30%, transparent);
            color: var(--topbar-text);
            cursor: pointer;
            font-size: 0.78rem;
            padding: 0.25rem 0.65rem;
            border-radius: 0.3rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 8.5rem;
            justify-content: center;
            opacity: 0.85;
            transition: opacity 0.12s, border-color 0.12s;
            line-height: 1;
            white-space: nowrap;
        }

        .search-btn:hover {
            opacity: 1;
            border-color: var(--topbar-accent);
        }

        .search-btn kbd {
            font-size: 0.65rem;
            opacity: 0.6;
            font-family: inherit;
        }

        .search-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: flex-start;
            padding-top: 12vh;
        }

        .search-overlay.open {
            display: flex;
        }

        .search-dialog {
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 0.6rem;
            width: min(92vw, 36rem);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .search-dialog input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--sidebar-border);
            padding: 0.85rem 1rem;
            font-size: 1rem;
            background: transparent;
            color: inherit;
            outline: none;
        }

        .search-results {
            max-height: 50vh;
            overflow-y: auto;
            padding: 0.25rem 0;
        }

        .search-results .search-item {
            display: block;
            padding: 0.55rem 1rem;
            text-decoration: none;
            color: var(--sidebar-text);
            font-size: 0.88rem;
            cursor: pointer;
        }

        .search-results .search-item:hover,
        .search-results .search-item.selected {
            background: var(--sidebar-active-bg);
            color: var(--sidebar-active-text);
        }

        .search-results .search-item .search-section {
            font-size: 0.72rem;
            color: var(--toc-text);
        }

        .search-empty {
            padding: 1.5rem 1rem;
            text-align: center;
            color: var(--toc-text);
            font-size: 0.88rem;
        }

        /* ── Prev / Next navigation ───────────────────────────── */
        .page-nav {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--sidebar-border);
        }

        .page-nav a {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 0.4rem;
            border: 1px solid var(--sidebar-border);
            transition: border-color 0.15s, background 0.15s;
            max-width: 48%;
        }

        .page-nav a:hover {
            border-color: var(--brand-teal);
            background: var(--sidebar-active-bg);
        }

        .page-nav a .nav-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--toc-text);
            margin-bottom: 0.15rem;
        }

        .page-nav a .nav-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--link-color);
        }

        .page-nav .next { margin-left: auto; text-align: right; }

        /* ── Hero landing page ─────────────────────────────────── */
        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }

        .hero img {
            max-width: min(100%, 440px);
            margin-bottom: 1rem;
        }

        .hero h1 {
            border: none;
            font-size: 2.2rem;
            padding-bottom: 0;
        }

        .hero .tagline {
            font-size: 1.05rem;
            color: var(--toc-text);
            max-width: 36rem;
            margin: 0 auto 1.5rem;
        }

        .hero .hero-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .hero .hero-actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.25rem;
            border-radius: 0.35rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: filter 0.15s;
        }

        .hero .hero-actions a:hover { filter: brightness(1.1); }

        .btn-primary {
            background: var(--brand-teal);
            color: #fff !important;
        }

        .btn-secondary {
            background: color-mix(in srgb, var(--brand-sky) 22%, transparent);
            color: var(--brand-navy) !important;
            border: 1px solid var(--sidebar-border);
        }

        [data-theme="dark"] .btn-secondary {
            color: var(--brand-sky) !important;
        }

        .hero-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
            gap: 0.75rem;
            text-align: left;
            margin-top: 1.5rem;
        }

        .hero-card {
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--sidebar-border);
            background: var(--sidebar-bg);
        }

        .hero-card .card-icon { margin-bottom: 0.3rem; color: var(--brand-teal); }
        .hero-card .card-icon svg { width: 1.5rem; height: 1.5rem; }
        .hero-card h3 { margin: 0 0 0.25rem; font-size: 0.92rem; }
        .hero-card p { margin: 0; font-size: 0.82rem; color: var(--toc-text); }

        /* ── Loading state ─────────────────────────────────────── */
        .loading {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--toc-text);
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid var(--sidebar-border);
            border-top-color: var(--brand-teal);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Small screens ──────────────────────────────────────── */
        @media (max-width: 900px) {
            .topbar { gap: 0.4rem; padding: 0 0.75rem; }
            .topbar-brand { margin-right: 0; }
            .topbar-title { font-size: 0.92rem; }
            .topbar-links { display: none; }
            .topnav { display: none; }
            .search-btn kbd { display: none; }

            .content-wrap { padding: 1.25rem 1rem 3rem; }
            .toc { display: none; }
            .site-footer { padding: 0.65rem 0.75rem; }
        }

        @media (max-width: 1100px) {
            .toc { display: none; }
            .content-wrap { max-width: var(--content-max); }
        }
    </style>
</head>
<body>
    <!-- ── Top Bar ──────────────────────────────────────────── -->
    <div class="topbar">
        <a class="topbar-brand" href="#welcome.md">
            <img class="topbar-logo" src="ananke-logo.png" alt="Ananke" id="topbar-logo">
            <span class="topbar-title">Ananke</span>
        </a>
        <nav class="topnav" id="topnav"></nav>
        <span class="topbar-spacer"></span>
        <button class="search-btn" id="search-btn" aria-label="Search documentation"><i data-lucide="search" style="width:14px;height:14px"></i> Search</button>
        <div class="topbar-links">
            <a href="https://github.com/sevensamurai/Ananke" target="_blank" id="link-gh">GitHub</a>
            <a href="https://www.nuget.org/packages/Ananke" target="_blank">NuGet</a>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><i data-lucide="moon" style="width:16px;height:16px"></i></button>
        <button class="hamburger" id="hamburger" aria-label="Menu"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    </div>
    <div class="menu-backdrop" id="menu-backdrop"></div>
    <div class="menu-panel" id="menu-panel"></div>

    <!-- ── Content ───────────────────────────────────────────── -->
    <div class="content-area" id="content-area">
        <div class="content-wrap">
            <article class="content" id="content">
                <div class="loading">Loading…</div>
            </article>
            <aside class="toc" id="toc"></aside>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>Made with <i data-lucide="heart" class="footer-love" aria-hidden="true"></i> in Melbourne, Australia.</span>
            <span><a href="https://github.com/sevensamurai/Ananke/blob/main/LICENSE" target="_blank" rel="noopener">Apache 2.0</a>. &copy; 2026 <a href="https://github.com/sevensamurai/" target="_blank">J Patricio Gonzalez S</a>.</span>
        </div>
    </footer>

    <!-- ── Search Overlay ───────────────────────────────────── -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-dialog">
            <input type="text" id="search-input" placeholder="Search docs…" autocomplete="off">
            <div class="search-results" id="search-results">
                <div class="search-empty">Type to search across all pages…</div>
            </div>
        </div>
    </div>

<script>
(() => {
    // ── Elements ──────────────────────────────────────────────
    const content       = document.getElementById('content');
    const contentArea   = document.getElementById('content-area');
    const tocEl         = document.getElementById('toc');
    const themeBtn      = document.getElementById('theme-toggle');
    const hamburgerBtn  = document.getElementById('hamburger');
    const menuPanel     = document.getElementById('menu-panel');
    const menuBackdrop  = document.getElementById('menu-backdrop');
    const searchBtn     = document.getElementById('search-btn');
    const searchOverlay = document.getElementById('search-overlay');
    const searchInput   = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const topnavEl      = document.getElementById('topnav');

    let siteData   = null;
    let flatItems  = [];   // ordered list of { title, path } for prev/next
    let activePath = '';

    // ── Hamburger menu ────────────────────────────────────────
    function closeMenu() { menuPanel.classList.remove('open'); menuBackdrop.classList.remove('open'); }
    function toggleMenu() { menuPanel.classList.toggle('open'); menuBackdrop.classList.toggle('open'); }
    hamburgerBtn.addEventListener('click', toggleMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    // ── Theme ─────────────────────────────────────────────────
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeBtn.innerHTML = `<i data-lucide="${theme === 'dark' ? 'sun' : 'moon'}" style="width:16px;height:16px"></i>`;
        if (window.lucide) lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} });
        localStorage.setItem('ananke-theme', theme);

        // Swap highlight.js stylesheets
        const light = document.getElementById('hljs-light');
        const dark  = document.getElementById('hljs-dark');
        if (light) light.media = theme === 'dark' ? 'not all' : 'all';
        if (dark)  dark.media  = theme === 'dark' ? 'all' : 'not all';
    }

    const savedTheme = localStorage.getItem('ananke-theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ── Markdown setup ────────────────────────────────────────
    const renderer = new marked.Renderer();

    // Rewrite .md links to hash routes
    renderer.link = function({ href, title, tokens }) {
        const text = this.parser.parseInline(tokens);
        if (href && href.endsWith('.md') && !href.startsWith('http')) {
            // Resolve relative paths based on the currently viewed page
            const resolved = resolveRelativeLink(href);
            const t = title ? ` title="${escapeAttr(title)}"` : '';
            return `<a href="#${resolved}"${t}>${text}</a>`;
        }
        if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:')) {
            // Handle relative links to .md files with anchors: "file.md#section"
            const [filePart, anchor] = href.split('#');
            if (filePart.endsWith('.md')) {
                const resolved = resolveRelativeLink(filePart);
                const t = title ? ` title="${escapeAttr(title)}"` : '';
                const a = anchor ? `?anchor=${anchor}` : '';
                return `<a href="#${resolved}${a}"${t}>${text}</a>`;
            }
        }
        const t = title ? ` title="${escapeAttr(title)}"` : '';
        const ext = href && href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
        return `<a href="${href}"${t}${ext}>${text}</a>`;
    };

    // Rewrite relative image src
    renderer.image = function({ href, title, text }) {
        if (href && !href.startsWith('http') && !href.startsWith('data:')) {
            href = resolveRelativePath(href);
        }
        const t = title ? ` title="${escapeAttr(title)}"` : '';
        return `<img src="${href}" alt="${escapeAttr(text)}"${t}>`;
    };

    // Add ids to headings for TOC links
    renderer.heading = function({ text, depth, raw, tokens }) {
        const id = slugify(raw);
        const rendered = tokens ? this.parser.parseInline(tokens) : text;
        return `<h${depth} id="${id}">${rendered}</h${depth}>`;
    };

    marked.setOptions({ renderer, breaks: false, gfm: true });

    function resolveRelativeLink(href) {
        // Combine current page directory with relative href
        const base = activePath.includes('/') ? activePath.substring(0, activePath.lastIndexOf('/') + 1) : '';
        const parts = (base + href).split('/');
        const resolved = [];
        for (const p of parts) {
            if (p === '..') resolved.pop();
            else if (p !== '.' && p !== '') resolved.push(p);
        }
        return resolved.join('/');
    }

    function resolveRelativePath(href) {
        const base = activePath.includes('/') ? activePath.substring(0, activePath.lastIndexOf('/') + 1) : '';
        const parts = (base + href).split('/');
        const resolved = [];
        for (const p of parts) {
            if (p === '..') resolved.pop();
            else if (p !== '.' && p !== '') resolved.push(p);
        }
        return resolved.join('/');
    }

    function slugify(text) {
        return text.toLowerCase()
            .replace(/<[^>]+>/g, '')
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-');
    }

    function escapeAttr(s) {
        return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    // ── Load site manifest ────────────────────────────────────
    async function init() {
        try {
            const resp = await fetch('site.json');
            siteData = await resp.json();
        } catch (e) {
            content.innerHTML = '<p>⚠️ Failed to load <code>site.json</code>.</p>';
            return;
        }

        // Update topbar links from manifest
        const ghLink = document.getElementById('link-gh');
        if (siteData.repo) ghLink.href = siteData.repo;
        if (siteData.logo) document.getElementById('topbar-logo').src = siteData.logo;

        // Build navigation
        buildTopNav();
        buildMenu();

        // Navigate to hash or default
        window.addEventListener('hashchange', onHashChange);
        onHashChange();
    }

    // ── Top navigation (desktop dropdowns) ─────────────────────
    function buildTopNav() {
        if (!siteData.topNav || !topnavEl) return;
        topnavEl.innerHTML = '';

        const sectionMap = {};
        for (const sec of siteData.sections) { sectionMap[sec.title] = sec; }

        for (const nav of siteData.topNav) {
            const item = document.createElement('div');
            item.className = 'topnav-item';

            if (nav.path) {
                const a = document.createElement('a');
                a.href = '#' + nav.path;
                a.textContent = nav.title;
                item.appendChild(a);
                topnavEl.appendChild(item);
                continue;
            }

            const btn = document.createElement('button');
            btn.innerHTML = nav.title + ' <i data-lucide="chevron-down" style="width:12px;height:12px"></i>';
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeAllDropdowns(item);
                item.classList.toggle('open');
            });
            item.appendChild(btn);

            const sections = (nav.sections || []).map(function(s) { return sectionMap[s]; }).filter(Boolean);
            const isWide = sections.length > 2;
            const dropdown = document.createElement('div');
            dropdown.className = isWide ? 'topnav-dropdown topnav-dropdown-wide' : 'topnav-dropdown';

            if (isWide) {
                const mid = Math.ceil(sections.length / 2);
                [sections.slice(0, mid), sections.slice(mid)].forEach(function(group) {
                    const col = document.createElement('div');
                    col.className = 'dropdown-col';
                    group.forEach(function(sec) {
                        const h = document.createElement('div');
                        h.className = 'dropdown-heading';
                        h.textContent = sec.title;
                        col.appendChild(h);
                        sec.items.forEach(function(it) {
                            const a = document.createElement('a');
                            a.href = '#' + it.path;
                            a.textContent = it.title;
                            a.addEventListener('click', function() { closeAllDropdowns(); });
                            col.appendChild(a);
                        });
                    });
                    dropdown.appendChild(col);
                });
            } else {
                sections.forEach(function(sec) {
                    if (sections.length > 1) {
                        const h = document.createElement('div');
                        h.className = 'dropdown-heading';
                        h.textContent = sec.title;
                        dropdown.appendChild(h);
                    }
                    sec.items.forEach(function(it) {
                        const a = document.createElement('a');
                        a.href = '#' + it.path;
                        a.textContent = it.title;
                        a.addEventListener('click', function() { closeAllDropdowns(); });
                        dropdown.appendChild(a);
                    });
                });
            }

            item.appendChild(dropdown);
            topnavEl.appendChild(item);
        }

        if (window.lucide) lucide.createIcons();
    }

    function closeAllDropdowns(except) {
        topnavEl.querySelectorAll('.topnav-item.open').forEach(function(el) {
            if (el !== except) el.classList.remove('open');
        });
    }

    document.addEventListener('click', function() { if (topnavEl) closeAllDropdowns(); });

    // ── Hamburger menu contents (collapsible sections) ─────────
    function buildMenu() {
        menuPanel.innerHTML = '';
        flatItems = [];

        for (const section of siteData.sections) {
            const heading = document.createElement('div');
            heading.className = 'menu-section';
            heading.textContent = section.title;

            const group = document.createElement('div');
            group.className = 'menu-group';

            heading.addEventListener('click', function() {
                heading.classList.toggle('expanded');
                group.classList.toggle('expanded');
            });

            menuPanel.appendChild(heading);

            for (const item of section.items) {
                const a = document.createElement('a');
                a.href = '#' + item.path;
                a.textContent = item.title;
                a.dataset.path = item.path;
                a.addEventListener('click', closeMenu);
                group.appendChild(a);
                flatItems.push({ title: item.title, path: item.path, section: section.title });
            }

            menuPanel.appendChild(group);
        }
    }

    // ── Highlight active menu item ─────────────────────────────
    function highlightNav(path) {
        menuPanel.querySelectorAll('a').forEach(function(a) {
            a.classList.toggle('active', a.dataset.path === path);
        });
        menuPanel.querySelectorAll('.menu-group').forEach(function(g) {
            if (g.querySelector('a.active')) {
                g.classList.add('expanded');
                g.previousElementSibling.classList.add('expanded');
            }
        });
    }

    // ── Navigation ────────────────────────────────────────────
    function onHashChange() {
        let hash = location.hash.slice(1) || 'welcome.md';
        // Strip query params for anchor scrolling
        let anchor = null;
        if (hash.includes('?anchor=')) {
            const parts = hash.split('?anchor=');
            hash = parts[0];
            anchor = parts[1];
        }
        loadPage(hash, anchor);
    }

    async function loadPage(path, scrollAnchor) {
        activePath = path;
        highlightNav(path);

        content.innerHTML = '<div class="loading">Loading…</div>';

        // Check for landing page
        if (path === 'welcome.md') {
            await loadLandingPage();
            return;
        }

        try {
            const resp = await fetch(path);
            if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
            let md = await resp.text();

            content.innerHTML = marked.parse(md);

            // Syntax highlighting
            content.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });

            // Add copy buttons to code blocks
            addCopyButtons();

            // Build TOC
            buildToc();

            // Build prev/next
            buildPageNav();

            // Set page title
            const h1 = content.querySelector('h1');
            if (h1) document.title = `${h1.textContent} — Ananke`;

            // Scroll
            contentArea.scrollTop = 0;
            if (scrollAnchor) {
                const target = document.getElementById(scrollAnchor);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

        } catch (e) {
            content.innerHTML = `<h1>Page not found</h1><p>Could not load <code>${path}</code>.</p><p>${e.message}</p>`;
        }
    }

    // ── Landing page ──────────────────────────────────────────
    async function loadLandingPage() {
        // Fetch the learning.md and render it, but wrap with hero
        try {
            const resp = await fetch(activePath);
            if (!resp.ok) throw new Error('Failed to load');
            const md = await resp.text();
            const heroImage = siteData.heroImage || siteData.logo;

            // Extract the title and intro, then render the rest
            content.innerHTML = `
                <div class="hero">
                    <img src="${heroImage}" alt="Ananke">
                    <p class="tagline">Vendor-agnostic, production-ready .NET framework for building AI agents and automated multi-step pipelines.</p>
                    <div class="hero-actions">
                        <a class="btn-primary" href="#guides/01-getting-started.md"><i data-lucide="arrow-right" style="width:15px;height:15px"></i> Get Started</a>
                        <a class="btn-secondary" href="#guides/00-nnke-tool.md"><i data-lucide="wand-sparkles" style="width:15px;height:15px"></i> nnke Tool</a>
                        <a class="btn-secondary" href="#reference/features.md"><i data-lucide="list" style="width:15px;height:15px"></i> Feature Index</a>
                        <a class="btn-secondary" href="${siteData.repo}" target="_blank"><i data-lucide="github" style="width:15px;height:15px"></i> GitHub</a>
                    </div>
                    <div class="hero-cards">
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="git-merge"></i></div>
                            <h3>Workflow Orchestration</h3>
                            <p>Fluent graph builder, conditional routing, fork/join parallelism, sub-workflows, streaming.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="bot"></i></div>
                            <h3>AI Agents</h3>
                            <p>Tool calling, structured output, multi-provider (OpenAI, Anthropic, Google, local).</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="brain"></i></div>
                            <h3>Memory & Learning</h3>
                            <p>RAG document ingestion, empirical learning from interactions, skill package export/import.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="hand"></i></div>
                            <h3>Human-in-the-Loop</h3>
                            <p>Pause, checkpoint, resume with approval. Full state persistence.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="cog"></i></div>
                            <h3>State Machine</h3>
                            <p>Interrupt stack, RedLock coordination, middleware pipeline, circuit breaking.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="radio"></i></div>
                            <h3>MCP & A2A</h3>
                            <p>Expose workflows as MCP servers. Agent-to-Agent protocol support.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="terminal"></i></div>
                            <h3>nnke Design CLI</h3>
                            <p>Scaffold projects, validate topologies, export diagrams. MCP companion for AI coding tools.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="repeat"></i></div>
                            <h3>Agentic Patterns</h3>
                            <p>Review &amp; Critique, Iterative Refinement — pre-wired builders for recognized patterns.</p>
                        </div>
                        <div class="hero-card">
                            <div class="card-icon"><i data-lucide="book-open"></i></div>
                            <h3>External Skill Catalog</h3>
                            <p>Discover and run Python, Node.js, and Docker tools from registries — no install needed.</p>
                        </div>
                    </div>
                </div>
                <hr>
                ${marked.parse(md)}
            `;

            content.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            addCopyButtons();
            buildToc();
            buildPageNav();
            lucide.createIcons();
            document.title = 'Ananke — AI Agent Orchestration for .NET';
            contentArea.scrollTop = 0;

        } catch (e) {
            content.innerHTML = `<p>⚠️ Could not load landing page.</p>`;
        }
    }

    // ── Table of Contents (right rail) ────────────────────────
    let tocObserver = null;

    function buildToc() {
        // Disconnect previous observer
        if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
        tocEl.innerHTML = '';

        const headings = content.querySelectorAll('h2, h3');
        if (headings.length < 2) return;

        let html = '<div class="toc-title">On this page</div>';
        headings.forEach(h => {
            const level = h.tagName === 'H3' ? ' toc-h3' : '';
            html += `<a class="${level}" data-target="${h.id}">${h.textContent}</a>`;
        });
        tocEl.innerHTML = html;

        // Click handler: scroll heading into view without changing hash
        tocEl.querySelectorAll('a[data-target]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.getElementById(link.dataset.target);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Intersection observer for active TOC highlighting
        tocObserver = new IntersectionObserver(entries => {
            for (const entry of entries) {
                if (entry.isIntersecting) {
                    tocEl.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                    const link = tocEl.querySelector(`a[data-target="${entry.target.id}"]`);
                    if (link) link.classList.add('active');
                }
            }
        }, { root: contentArea, rootMargin: '-10px 0px -80% 0px', threshold: 0 });

        headings.forEach(h => tocObserver.observe(h));
    }

    // ── Search ────────────────────────────────────────────────
    function openSearch() {
        searchOverlay.classList.add('open');
        searchInput.value = '';
        searchInput.focus();
        renderSearchResults('');
    }

    function closeSearch() {
        searchOverlay.classList.remove('open');
    }

    searchBtn.addEventListener('click', openSearch);

    searchOverlay.addEventListener('click', (e) => {
        if (e.target === searchOverlay) closeSearch();
    });

    document.addEventListener('keydown', (e) => {
        // Cmd/Ctrl + K to open search
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            searchOverlay.classList.contains('open') ? closeSearch() : openSearch();
        }
        // Escape to close
        if (e.key === 'Escape' && searchOverlay.classList.contains('open')) {
            closeSearch();
        }
    });

    let searchSelectedIdx = -1;

    searchInput.addEventListener('input', () => {
        searchSelectedIdx = -1;
        renderSearchResults(searchInput.value.trim());
    });

    searchInput.addEventListener('keydown', (e) => {
        const items = searchResults.querySelectorAll('.search-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            searchSelectedIdx = Math.min(searchSelectedIdx + 1, items.length - 1);
            updateSearchSelection(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            searchSelectedIdx = Math.max(searchSelectedIdx - 1, 0);
            updateSearchSelection(items);
        } else if (e.key === 'Enter' && searchSelectedIdx >= 0 && items[searchSelectedIdx]) {
            e.preventDefault();
            items[searchSelectedIdx].click();
        }
    });

    function updateSearchSelection(items) {
        items.forEach((el, i) => el.classList.toggle('selected', i === searchSelectedIdx));
        if (items[searchSelectedIdx]) items[searchSelectedIdx].scrollIntoView({ block: 'nearest' });
    }

    function renderSearchResults(query) {
        if (!query) {
            searchResults.innerHTML = '<div class="search-empty">Type to search across all pages…</div>';
            return;
        }

        const q = query.toLowerCase();
        const matches = [];

        for (const section of siteData.sections) {
            for (const item of section.items) {
                const haystack = [
                    item.title,
                    section.title,
                    ...(item.tags || [])
                ].join(' ').toLowerCase();
                if (haystack.includes(q)) {
                    matches.push({ title: item.title, path: item.path, section: section.title });
                }
            }
        }

        if (matches.length === 0) {
            searchResults.innerHTML = `<div class="search-empty">No pages matching "${escapeAttr(query)}"</div>`;
            return;
        }

        searchResults.innerHTML = matches.map(m =>
            `<a class="search-item" href="#${m.path}"><span class="search-section">${m.section}</span> ${m.title}</a>`
        ).join('');

        searchResults.querySelectorAll('.search-item').forEach(a => {
            a.addEventListener('click', closeSearch);
        });
    }

    // ── Prev / Next ───────────────────────────────────────────
    function buildPageNav() {
        const idx = flatItems.findIndex(i => i.path === activePath);
        if (idx === -1) return;

        const prev = idx > 0 ? flatItems[idx - 1] : null;
        const next = idx < flatItems.length - 1 ? flatItems[idx + 1] : null;

        if (!prev && !next) return;

        let html = '<div class="page-nav">';
        if (prev) {
            html += `<a href="#${prev.path}" class="prev">
                <span class="nav-label">← Previous</span>
                <span class="nav-title">${prev.title}</span>
            </a>`;
        }
        if (next) {
            html += `<a href="#${next.path}" class="next">
                <span class="nav-label">Next →</span>
                <span class="nav-title">${next.title}</span>
            </a>`;
        }
        html += '</div>';
        content.insertAdjacentHTML('beforeend', html);
    }

    // ── Copy buttons ──────────────────────────────────────────
    function addCopyButtons() {
        content.querySelectorAll('pre').forEach(pre => {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.addEventListener('click', async () => {
                const code = pre.querySelector('code');
                const text = code ? code.textContent : pre.textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = '✓ Copied';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                } catch {
                    btn.textContent = 'Failed';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                }
            });
            pre.appendChild(btn);
        });
    }

    // ── Go ────────────────────────────────────────────────────
    init().then(() => lucide.createIcons());
})();
</script>
</body>
</html>
